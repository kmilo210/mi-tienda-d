<!DOCTYPE html>
<html lang="es">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Colección | Fati Design</title>

  <meta
    name="description"
    content="Descubre nuestros productos en Mi Tienda D."
  />

  <meta name="robots" content="index, follow" />

  <link rel="canonical" id="canonical-url" href="https://mitiendad.store/categoria.html" />

  <meta property="og:type" content="website" />
  <meta property="og:title" id="og-title" content="Mi Tienda D" />
  <meta property="og:description" id="og-description" content="Blusas y Ropa Femenina en Colombia" />
  <meta property="og:image" id="og-image" content="https://mitiendad.store/images/Logomitiendad.svg" />
  <meta property="og:url" id="og-url" content="https://mitiendad.store/categoria.html" />
  <meta property="og:site_name" content="Mi Tienda D" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>


<body>

  <header class="site-header" id="site-header"></header>

  <div id="mobile-nav-overlay-container"></div>
  <nav class="mobile-nav-panel" id="mobile-nav-panel"></nav>

  <main class="layout-with-sidebar">
    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <div>
      <div class="category-header">
        <h1 id="category-title">Colección</h1>
      </div>
      <div class="category-products-grid" id="category-products-grid"></div>
      <div class="empty-state" id="category-empty">Aún no hay productos en esta colección.</div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const catSlug = getQueryParam("cat");
    renderHeader("inner");
    renderMobileNavOverlay();
    renderSidebar(catSlug);
    renderFooter();
    renderCategoryPage();
  </script>
</body>
</html>
